<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09121b">
  <title>Andar · /auto</title>
  <style>
    :root{color-scheme:dark;--bg:#09121b;--panel:#101d29;--panel-soft:#162735;--text:#ecf3f7;--muted:#a2b6c7;--line:#2a3c4b;--accent:#8ce4ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui}button,a,textarea,select{touch-action:manipulation}button{cursor:pointer;font:inherit;background:var(--panel-soft);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:9px 12px;min-height:44px}a{color:var(--accent)}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}[hidden]{display:none!important}h1,h2,h3,p{margin:0}h1{font-size:20px}h2{font-size:18px}h3{font-size:13px;color:var(--accent);margin:16px 0 6px}small,.muted{color:var(--muted)}header.top{min-height:96px;padding:16px 24px;border-bottom:1px solid var(--line);display:flex;gap:22px;align-items:center;flex-wrap:wrap}.heading{flex:1;min-width:180px}.kpis{display:flex;gap:20px;flex-wrap:wrap}.kpis strong{display:block;font-size:23px;color:var(--accent)}.kpis span{font-size:11px;color:var(--muted)}main{display:grid;grid-template-columns:minmax(0,1fr) 330px;height:calc(100dvh - 125px)}.viewport{position:relative;min-height:260px;background:radial-gradient(ellipse at center,#223344,#0a1828 80%);overflow:hidden}#scene{position:absolute;inset:0}#scene canvas{display:block}.help{position:absolute;left:16px;bottom:16px;pointer-events:none;font-size:11px;color:#c5d9e9}.fallback{position:absolute;left:20px;top:20px;max-width:300px;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}aside{background:var(--panel);border-left:1px solid var(--line);min-height:0;display:flex;flex-direction:column}.aside-head{display:flex;justify-content:space-between;align-items:center;padding:16px}.employees{overflow:auto;padding:0 12px 90px;scrollbar-width:thin}.employee{display:block;width:100%;text-align:left;margin-bottom:8px}.employee small{display:block;white-space:normal;overflow-wrap:anywhere}.employee[aria-pressed=true]{border-color:var(--accent)}.drawer{display:none}footer.live{padding:5px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}.plate{font-size:10px;background:#091b2beb;border:1px solid #547b91;border-radius:5px;color:#ecf3f7;padding:3px 7px;max-width:140px;overflow-wrap:anywhere;pointer-events:none}.bubble{font-size:11px;max-width:180px;overflow-wrap:anywhere;background:#163e53;color:#fff;padding:6px;border:1px solid #8ce4ef;border-radius:10px;pointer-events:none}.ficha{position:fixed;left:20px;top:110px;bottom:90px;width:min(440px,calc(100vw - 40px));background:var(--panel);border:1px solid var(--line);border-radius:14px;z-index:10;padding:20px;overflow:auto;box-shadow:0 20px 60px #0008}.ficha p,.ficha li{white-space:pre-wrap;overflow-wrap:anywhere}.ficha ul{padding-left:20px}.ficha .close{float:right;margin-left:10px}.ficha .ask{margin-top:18px;width:100%}
    @media(max-width:700px){header.top{padding:12px;gap:10px}.heading h1{font-size:16px}.kpis{gap:14px;width:100%}.kpis strong{font-size:18px;display:inline;margin-right:5px}main{height:calc(100dvh - 160px);display:flex;flex-direction:column}.viewport{flex:1;min-height:180px}aside{height:30dvh;min-height:140px;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0}aside.expanded{height:55dvh}.aside-head{padding:10px 14px}.drawer{display:block}.ficha{top:16px}.employees{padding-bottom:80px}}
    body{overflow-x:clip}header.top>*{min-width:0}.heading{overflow-wrap:anywhere}main{min-height:0}aside{overflow:auto}.sidebar-content{padding:0 12px 90px}.employees{overflow:visible;padding:0}.pending{padding:14px 4px 18px;border-bottom:1px solid var(--line);margin-bottom:14px}.pending h2{display:flex;align-items:center;gap:8px}.count,.chip,.badge{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:3px 9px;font-size:11px}.pending ul{list-style:none;padding:0;margin:12px 0 0}.pending li{display:flex;gap:9px;margin:10px 0;font-size:13px;overflow-wrap:anywhere}.pending li span:last-child{min-width:0}code{font-size:.9em;background:var(--panel-soft);padding:1px 4px;border-radius:4px;overflow-wrap:anywhere}.ficha{left:auto;right:20px;top:105px;bottom:85px}.profile{display:flex;gap:16px;align-items:center;clear:both;padding-top:12px}.profile-info{min-width:0}.portrait{width:112px;flex:0 0 112px;height:136px;border-radius:18px;background:var(--panel-soft)}.portrait-bust{transform-origin:60px 130px;animation:breathe 4s ease-in-out infinite}.portrait-eyes{transform-box:fill-box;transform-origin:center;animation:blink 6s infinite}.badge{margin-top:8px}.badge[data-state=ativo]{color:#91caff;border-color:#5f9cca}.badge[data-state=feito]{color:#9ce0b7;border-color:#529d71}.badge[data-state=pendente]{color:#ffcf82;border-color:#b48b4e}.timeline{list-style:none;padding:0!important}.timeline li{border-left:2px solid var(--line);padding:2px 0 14px 12px}.timeline time{display:block;font-size:11px;color:var(--muted)}.chips{display:flex;flex-wrap:wrap;gap:6px}.ficha h3{margin-top:22px}.ficha .close{position:sticky;top:0;z-index:1}.aside-head h2{font-size:16px}@keyframes breathe{50%{transform:translateY(-1px) scaleY(1.015)}}@keyframes blink{0%,44%,48%,100%{transform:scaleY(1)}46%{transform:scaleY(.08)}}
    @media(max-width:700px){.sidebar-content{padding-bottom:80px}.kpis{gap:6px 14px}.ficha{inset:auto 0 0;width:100%;max-height:92dvh;bottom:0;border-radius:22px 22px 0 0;padding:18px 18px max(80px,env(safe-area-inset-bottom));animation:sheet-in .2s ease-out}.portrait{width:96px;flex-basis:96px;height:118px}.ficha h2{font-size:18px}.help{max-width:calc(100% - 32px)}main{height:calc(100dvh - 190px)}}@keyframes sheet-in{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
    #theme-actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 4px 16px}#theme-actions a{padding:9px 0;min-height:44px}#theme-message{width:100%;font-size:12px;overflow-wrap:anywhere}
    .employee,.profile-info{overflow-wrap:anywhere}.profile-info{flex:1}.ficha{overscroll-behavior:contain}
    @media(prefers-reduced-motion:reduce){.portrait-bust,.portrait-eyes,.ficha{animation:none}}
    @media(prefers-color-scheme:light){:root{color-scheme:light;--bg:#eef3f6;--panel:#f9fbfc;--panel-soft:#e8f0f4;--text:#182d3b;--muted:#4d6677;--line:#c7d6df;--accent:#096c80}.badge{color:var(--text)!important}}
  </style>
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}
  </script>

<body>
  <header class="top"><a href="/">← Prédio</a><div class="heading"><h1 id="title">Carregando andar…</h1><p id="status" class="muted" role="status">Verificando sessão…</p></div><a id="central" hidden target="_blank" rel="noopener noreferrer">Abrir central</a><div id="kpis" class="kpis" aria-label="Indicadores do andar"></div></header>
  <main id="workspace" hidden><section class="viewport" aria-label="Cena 3D do andar"><div id="scene"></div><p class="fallback" id="fallback" role="status">Preparando as sete mesas…</p><p class="help">Arraste para orbitar · toque em uma mesa ou funcionário</p></section><aside id="sidebar" aria-label="Pendências e funcionários"><div class="aside-head"><span class="muted">Neste andar</span><button id="drawer" class="drawer" aria-expanded="false" aria-controls="sidebar-content">Expandir</button></div><div id="sidebar-content" class="sidebar-content"><nav id="theme-actions" aria-label="Ambiente visual" hidden>
    <button id="create-theme" type="button" hidden>Criar ambiente visual</button>
    <a id="open-dashboard" hidden>Abrir dashboard</a>
    <a id="edit-theme" hidden>Editar tema</a>
    <span id="theme-message" role="status"></span>
  </nav><section class="pending" aria-labelledby="pending-title"><h2 id="pending-title">Pendências <span id="pending-count" class="count">0</span></h2><ul id="pending-list"></ul></section><div class="aside-head"><h2>Funcionários</h2></div><div id="employees" class="employees"></div></div></aside></main>
  <footer class="live" id="live" role="status">Ao vivo · conectando…</footer>
  <section id="ficha" class="ficha" role="region" aria-label="Ficha do funcionário" hidden tabindex="-1"></section>
  <script type="module" src="/andar.js"></script>
